<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Location Sharing</title>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  padding:25px;
  background:#f5f5f5;
}
.box{
  max-width:450px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 15px #ccc;
}
button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  font-size:18px;
  background:#128c7e;
  color:white;
}
#result{
  margin-top:20px;
  word-break:break-word;
}
a{
  display:block;
  margin-top:15px;
  font-size:17px;
}
</style>
</head>

<body>

<div class="box">
<h1>📍 Live Location</h1>

<p>Apni location share karne ke liye neeche button dabayein.</p>

<button onclick="getLocation()">
📍 Share My Location
</button>

<div id="result"></div>
</div>

<script>
function getLocation(){

  const result=document.getElementById("result");

  if(!navigator.geolocation){
    result.innerHTML="❌ Phone location support nahi karta.";
    return;
  }

  result.innerHTML="⏳ Location permission maangi ja rahi hai...";

  navigator.geolocation.getCurrentPosition(
    function(position){

      const lat=position.coords.latitude;
      const lon=position.coords.longitude;

      const mapUrl=
        "https://www.google.com/maps?q="+lat+","+lon;

      result.innerHTML=`
        <h3>✅ Location mil gayi</h3>

        <a href="${mapUrl}" target="_blank">
          🗺️ Open Location on Google Maps
        </a>

        <button onclick="shareLocation('${mapUrl}')">
          📲 WhatsApp par Share Karein
        </button>
      `;
    },

    function(error){

      if(error.code===1){
        result.innerHTML=
        "❌ Location permission allow nahi ki gayi.";
      }else{
        result.innerHTML=
        "❌ Location nahi mil saki. GPS on karke dobara try karein.";
      }
    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}

function shareLocation(url){

  const message="📍 Meri current location: "+url;

  const whatsapp=
    "https://wa.me/?text="+encodeURIComponent(message);

  window.open(whatsapp,"_blank");
}
</script>

</body>
</html>
