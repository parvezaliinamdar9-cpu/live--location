<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📍 Live Location</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0002;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 90%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 95%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    #stop {
      background: #d32f2f;
    }

    #status {
      margin: 15px 0;
      font-weight: bold;
    }

    #location {
      margin-top: 15px;
      padding: 15px;
      background: #eef5ff;
      border-radius: 12px;
      display: none;
    }

    a {
      display: block;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>📍 Live Location</h1>

  <p>
    Location sirf tab share hogi jab sharer khud
    permission dekar sharing start kare.
  </p>

  <input id="room" placeholder="Room code (jaise 123456)">

  <button onclick="startSharing()">📍 Start Sharing</button>

  <button onclick="viewLocation()">🗺️ View Location</button>

  <button id="stop" onclick="stopSharing()">⛔ Stop Sharing</button>

  <div id="status">Room code enter karo.</div>

  <div id="location">
    <b>📍 Location received</b>
    <p id="coords"></p>
    <a id="mapLink" target="_blank">🗺️ Open location on map</a>
  </div>

</div>

<script>
  const socket = io();

  let watchId = null;
  let currentRoom = "";

  function getRoom() {
    const room = document.getElementById("room").value.trim();

    if (!room) {
      alert("Pehle room code enter karo.");
      return null;
    }

    return room;
  }

  function startSharing() {
    const room = getRoom();
    if (!room) return;

    currentRoom = room;

    if (!navigator.geolocation) {
      alert("Is browser me location supported nahi hai.");
      return;
    }

    socket.emit("join-room", {
      room: room,
      role: "sharer"
    });

    document.getElementById("status").innerText =
      "📡 Sharing start ho rahi hai...";

    watchId = navigator.geolocation.watchPosition(
      position => {

        const data = {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy,
          time: Date.now()
        };

        socket.emit("location-update", data);

        document.getElementById("status").innerText =
          "🟢 Location live share ho rahi hai.";
      },

      error => {
        document.getElementById("status").innerText =
          "❌ Location permission/error: " + error.message;
      },

      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 15000
      }
    );
  }

  function viewLocation() {
    const room = getRoom();
    if (!room) return;

    currentRoom = room;

    socket.emit("join-room", {
      room: room,
      role: "viewer"
    });

    document.getElementById("status").innerText =
      "👀 Location ka wait kar rahe hain...";
  }

  socket.on("location-update", data => {

    document.getElementById("location").style.display = "block";

    document.getElementById("coords").innerText =
      "Latitude: " + data.latitude +
      "\nLongitude: " + data.longitude +
      "\nAccuracy: " + Math.round(data.accuracy) + " meters";

    document.getElementById("mapLink").href =
      "https://www.google.com/maps?q=" +
      data.latitude + "," + data.longitude;

    document.getElementById("status").innerText =
      "🟢 Live location received.";
  });

  socket.on("stop-sharing", () => {
    document.getElementById("status").innerText =
      "⛔ Sharer ne location sharing stop kar di.";
  });

  function stopSharing() {

    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }

    socket.emit("stop-sharing");

    document.getElementById("status").innerText =
      "⛔ Location sharing stopped.";
  }
</script>

</body>
</html>
